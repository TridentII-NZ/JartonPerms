pexGroup=me.jarton.perms
pexVersion=1.0-SNAPSHOT
pexSuffix=
pexRelocationRoot=me.jarton.perms.ext
pexDescription=JartonPerms - a flat, fast permissions plugin for JartonMC

# The Java version to use for dev tasks. No compile toolchain is pinned anywhere in this
# project, so modules compile with whatever JDK launches Gradle; on this machine that's 21,
# so runSpigot/runVelocity's launcher needs to match (21) or the plugin jar they load won't
# verify (UnsupportedClassVersionError). Bumped from 16 during Task 5's build-verification pass
# once the ASM tooling (buildSrc/build.gradle.kts) was patched to read Java 21 bytecode.
developmentRuntime=21

# comma separated list of modules to exclude from the final archive
buildExcludes=

adventureVersion=4.7.0
adventurePlatformVersion=4.0.0
antlrVersion=4.9.2
autoServiceVersion=1.0-rc7
checkerVersion=3.11.0
cloudVersion=1.4.0
configurateVersion=4.0.0
errorproneVersion=2.5.1
h2Version=1.4.200
immutablesVersion=2.8.8
junitVersion=5.7.1
pCollectionsVersion=3.1.4
slf4jVersion=1.7.30
velocityVersion=1.1.4

kotlin.code.style=official
kapt.use.worker.api=true
kapt.include.compile.classpath=false
kapt.incremental.apt=false

org.gradle.caching=true
org.gradle.parallel=true
org.gradle.jvmargs=-Xmx1G
